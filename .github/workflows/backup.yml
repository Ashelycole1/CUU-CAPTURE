name: Nightly DB backup

# Dumps the Turso database to SQL with scripts/backup.ts (libSQL client only, no Turso CLI),
# compresses it, encrypts it with AES-256 (openssl, PBKDF2) and keeps it as a workflow
# artifact for 30 days. Nothing leaves GitHub. See docs/RUNBOOK.md "Backups and restore".
#
# Required repository secrets: DATABASE_URL, DATABASE_AUTH_TOKEN, BACKUP_PASSPHRASE.

on:
  schedule:
    - cron: '15 1 * * *' # 01:15 UTC = 04:15 Kampala, before the 03:00 UTC jobs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts skips native postinstalls (sharp) we don't need for a dump.
      - run: npm ci --ignore-scripts
      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set DATABASE_URL, DATABASE_AUTH_TOKEN and BACKUP_PASSPHRASE repository secrets."
            exit 1
          fi
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: npx tsx scripts/backup.ts --out backup.sql
      - name: Compress and encrypt
        id: enc
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          gzip -9 backup.sql
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in backup.sql.gz -out "visadesk-${STAMP}.sql.gz.enc" -pass env:BACKUP_PASSPHRASE
          sha256sum "visadesk-${STAMP}.sql.gz.enc" > "visadesk-${STAMP}.sha256"
          # Round-trip check: the artifact must decrypt with the same passphrase.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "visadesk-${STAMP}.sql.gz.enc" \
            -out check.sql.gz -pass env:BACKUP_PASSPHRASE
          gunzip -c check.sql.gz > check.sql
          grep -m1 -q -- '-- VisaDesk libSQL dump' check.sql
          shred -u backup.sql.gz check.sql.gz check.sql
          echo "name=visadesk-${STAMP}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.enc.outputs.name }}
          path: |
            ${{ steps.enc.outputs.name }}.sql.gz.enc
            ${{ steps.enc.outputs.name }}.sha256
          retention-days: 30
          if-no-files-found: error
          compression-level: 0 # already compressed + encrypted
